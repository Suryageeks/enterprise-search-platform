services:
  github-runner:
    image: myoung34/github-runner:latest
    container_name: github-runner
    restart: unless-stopped
  
    environment:
      REPO_URL: "https://github.com/Suryageeks/enterprise-search-platform"
      RUNNER_TOKEN: "${GITHUB_RUNNER_TOKEN:?Set GITHUB_RUNNER_TOKEN to a fresh self-hosted runner registration token}"
      RUNNER_NAME: "local-mac-docker-runner"
      RUNNER_WORKDIR: "/tmp/runner/work"
      LABELS: "self-hosted,local,docker"
      RUN_AS_ROOT: "true"
    
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
