{{- range $name, $service := .Values.services }}
{{- if and $service.enabled $service.config }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  labels:
    {{- include "enterprise-search.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
data:
  {{- range $key, $value := $service.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- end }}
