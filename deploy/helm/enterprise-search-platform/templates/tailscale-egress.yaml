{{- if .Values.tailscale.enabled }}
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroup
metadata:
  name: {{ .Values.tailscale.proxyGroupName }}
  labels:
    {{- include "enterprise-search.labels" . | nindent 4 }}
spec:
  type: egress
  replicas: {{ .Values.tailscale.replicas }}

{{- range $name, $dependency := .Values.tailscale.dependencies }}
{{- $externalName := "placeholder.invalid" }}
{{- $existingService := lookup "v1" "Service" $.Release.Namespace $name }}
{{- if and $existingService $existingService.spec.externalName }}
{{- $externalName = $existingService.spec.externalName }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "enterprise-search.labels" $ | nindent 4 }}
  annotations:
    tailscale.com/tailnet-fqdn: {{ $.Values.tailscale.dockerHostFqdn | quote }}
    tailscale.com/proxy-group: {{ $.Values.tailscale.proxyGroupName | quote }}

spec:
  type: ExternalName
  # Tailscale replaces this value with its egress Service name. Preserve the
  # live value on upgrades so Helm does not fight the operator for ownership.
  externalName: {{ $externalName | quote }}

  ports:
    - name: tcp
      port: {{ $dependency.port }}
      protocol: TCP
{{- end }}
{{- end }}
