services:
  docker-agent:
    image: docker:dind
    container_name: jenkins-docker-agent
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: "/certs"
    volumes:
      - docker-certs:/certs/client
      - docker-data:/var/lib/docker
    networks:
      - jenkins-network
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 30s
      timeout: 10s
      retries: 5
    
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jenkins
    restart: unless-stopped
    depends_on:
      docker-agent:
        condition: service_healthy
    environment:
      DOCKER_HOST: tcp://docker-agent:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins-home:/var/jenkins_home
      - docker-certs:/certs/client:ro
    networks:
      - jenkins-network

volumes:
  jenkins-home:
  docker-certs:
  docker-data:

networks:
  jenkins-network:
    driver: bridge