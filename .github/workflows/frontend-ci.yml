name: Frontend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend-ci.yml"
  
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend-ci.yml"
  
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: [self-hosted, local, docker]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          version="$(curl -sSfL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | sed -n 's/.*"tag_name": "v\([^"]*\)".*/\1/p')"
          arch="$(uname -m)"
          case "$arch" in
            aarch64|arm64) asset_arch="arm64" ;;
            x86_64|amd64) asset_arch="x64" ;;
            *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
          esac
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_${asset_arch}.tar.gz" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          chmod +x "$RUNNER_TEMP/bin/gitleaks"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      
      - name: Run Gitleaks
        run: gitleaks detect --source . --no-git --verbose --redact
  
  frontend:
    name: Lint Frontend
    runs-on: [self-hosted, local, docker]

    defaults:
      run:
        working-directory: apps/web
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run Biome lint
        run: npm run lint

  security-scan:
    name: Frontend Dependency Scan
    runs-on: [self-hosted, local, docker]

    defaults:
      run:
        working-directory: apps/web
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

  build:
    name: Build Frontend
    runs-on: [self-hosted, local, docker]
    needs:
      - frontend
      - secret-scan
      - security-scan

    defaults:
      run:
        working-directory: apps/web
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci
      
      - name: Build frontend
        run: npm run build
