http:
  routers:
    auth:
      entryPoints:
        - web
      rule: "PathPrefix(`/api/auth`)"
      middlewares:
        - strip-api-prefix
      service: auth

    document:
      entryPoints:
        - web
      rule: "PathPrefix(`/api/document`)"
      middlewares:
        - strip-api-prefix
      service: document

    query-rag:
      entryPoints:
        - web
      rule: "PathPrefix(`/api/rag`)"
      service: query-service

    query-analysis:
      entryPoints:
        - web
      rule: "PathPrefix(`/api/analysis`)"
      service: query-service

    query-agents:
      entryPoints:
        - web
      rule: "PathPrefix(`/api/agents`)"
      service: query-service

    worker:
      entryPoints:
        - web
      rule: "PathPrefix(`/api/worker`)"
      middlewares:
        - strip-worker-prefix
      service: worker-service

  middlewares:
    strip-api-prefix:
      stripPrefix:
        prefixes:
          - /api

    strip-worker-prefix:
      stripPrefix:
        prefixes:
          - /api/worker

  services:
    auth:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8082"
        responseForwarding:
          flushInterval: "100ms"

    document:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8083"
        responseForwarding:
          flushInterval: "100ms"

    query-service:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8000"
        responseForwarding:
          flushInterval: "100ms"

    worker-service:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8001"
        responseForwarding:
          flushInterval: "100ms"
