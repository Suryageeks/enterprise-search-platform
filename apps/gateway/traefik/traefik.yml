api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":9080"
    transport:
      respondingTimeouts:
        readTimeout: "0s"
        writeTimeout: "0s"
        idleTimeout: "0s"
  traefik:
    address: ":9081"

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

log:
  level: INFO

accessLog: {}
