spring.application.name=auth
server.port = 8082
server.address = 0.0.0.0

# PostgreSQL (Neon) Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-old-pond-a40neil4.us-east-1.aws.neon.tech:5432/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_LypEx9QamM1G}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.sql.init.mode=never
server.error.include-message=always

jwtSecret=${JWT_SECRET:askndankfkjdFHFAHKKHLHKAsecure256}
jwtExpiry=86400
