spring.application.name=documentservice
server.port=8083
server.address = 0.0.0.0

# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/aisearchdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.sql.init.mode=never
server.error.include-message=always

# AWS S3 Config
aws.s3.region=ap-south-1
aws.s3.endpoint=http://187.127.141.96:4566
aws.s3.access-key=test
aws.s3.secret-key=test
aws.s3.path-style-access=true
aws.s3.bucket-name=dev
aws.s3.base-dir=files

# File Upload Config
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Redis Config
spring.data.redis.host=187.127.141.96
spring.data.redis.port=6379
spring.data.redis.password=
app.redis.stream.ingestion-stream=log-ingestion
